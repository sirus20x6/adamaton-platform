[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-plugin-search-hackernews"
version = "0.1.0"
description = "Hacker News search plugin for the deepresearch plugin-host."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "dr-plugin-sdk",
    "grpcio>=1.65",
    "protobuf>=5,<8",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dr_plugin_search_hackernews*"]

[tool.setuptools.package-data]
"dr_plugin_search_hackernews" = ["../plugin.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
dr-plugin-sdk = { path = "../_sdk" }

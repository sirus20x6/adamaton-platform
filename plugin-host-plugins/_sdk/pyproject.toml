[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-plugin-sdk"
version = "0.1.0"
description = "Python SDK for deepresearch plugins (gRPC over Unix sockets)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "deepresearch" }]
license = { text = "Proprietary" }
dependencies = [
    "grpcio>=1.65",
    # protobuf must match the gencode version (7.x). grpcio-status is omitted
    # here because as of 1.80 it pins protobuf<7; re-add when it catches up.
    "protobuf>=5,<8",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dr_plugin_sdk*"]

[tool.setuptools.package-data]
"dr_plugin_sdk" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

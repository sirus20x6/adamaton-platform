<!-- /thearray/gogents/web/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoGents - AI PR Review Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div x-data="dashboard()" x-init="init()" class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-2">
                            <i class="fas fa-robot text-blue-600 text-2xl"></i>
                            <h1 class="text-2xl font-bold text-gray-900">GoGents</h1>
                        </div>
                        <span class="px-3 py-1 text-xs font-medium bg-green-100 text-green-800 rounded-full">
                            12 AI Agents Active
                        </span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                            <span class="text-sm text-gray-600">System Healthy</span>
                        </div>
                        <button @click="refreshData()" class="btn btn-secondary">
                            <i class="fas fa-sync-alt" :class="{'animate-spin': loading}"></i>
                            Refresh
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Overview Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="stats-card">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-code-pull-request text-blue-600 text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Total PRs Reviewed</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.totalPRs"></p>
                        </div>
                    </div>
                    <div class="mt-2">
                        <span class="text-green-600 text-sm font-medium">
                            +<span x-text="stats.todayPRs"></span> today
                        </span>
                    </div>
                </div>

                <div class="stats-card">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-check-circle text-green-600 text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Auto-Merged</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.autoMerged"></p>
                        </div>
                    </div>
                    <div class="mt-2">
                        <span class="text-green-600 text-sm font-medium">
                            <span x-text="((stats.autoMerged / stats.totalPRs) * 100).toFixed(1)"></span>% success rate
                        </span>
                    </div>
                </div>

                <div class="stats-card">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-exclamation-triangle text-yellow-600 text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Issues Found</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.issuesFound"></p>
                        </div>
                    </div>
                    <div class="mt-2">
                        <span class="text-red-600 text-sm font-medium">
                            <span x-text="stats.criticalIssues"></span> critical
                        </span>
                    </div>
                </div>

                <div class="stats-card">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-clock text-purple-600 text-2xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-600">Avg Review Time</p>
                            <p class="text-2xl font-semibold text-gray-900" x-text="stats.avgReviewTime"></p>
                        </div>
                    </div>
                    <div class="mt-2">
                        <span class="text-green-600 text-sm font-medium">
                            <i class="fas fa-arrow-down"></i> 15% faster
                        </span>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- Agent Performance Chart -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="fas fa-robot text-blue-600"></i>
                        Agent Performance (Last 7 Days)
                    </h3>
                    <canvas id="agentPerformanceChart" width="400" height="200"></canvas>
                </div>

                <!-- Review Outcome Trends -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="fas fa-chart-line text-green-600"></i>
                        Review Outcome Trends
                    </h3>
                    <canvas id="outcomeTrendsChart" width="400" height="200"></canvas>
                </div>
            </div>

            <!-- Recent PRs and Agent Status -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Recent PR Reviews -->
                <div class="lg:col-span-2 bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-900">
                            <i class="fas fa-history text-gray-600"></i>
                            Recent PR Reviews
                        </h3>
                    </div>
                    <div class="divide-y divide-gray-200">
                        <template x-for="pr in recentPRs" :key="pr.id">
                            <div class="px-6 py-4 hover:bg-gray-50">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div :class="{
                                            'bg-green-100 text-green-800': pr.status === 'merged',
                                            'bg-yellow-100 text-yellow-800': pr.status === 'review',
                                            'bg-red-100 text-red-800': pr.status === 'blocked'
                                        }" class="px-2 py-1 text-xs font-medium rounded-full">
                                            <span x-text="pr.status.toUpperCase()"></span>
                                        </div>
                                        <span class="text-sm font-medium text-gray-900" x-text="pr.title"></span>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-sm text-gray-500" x-text="pr.score + '/1.0'"></span>
                                        <span class="text-xs text-gray-400" x-text="pr.timeAgo"></span>
                                    </div>
                                </div>
                                <div class="mt-2 flex items-center space-x-4 text-sm text-gray-600">
                                    <span><i class="fab fa-github"></i> <span x-text="pr.repo"></span></span>
                                    <span><i class="fas fa-user"></i> <span x-text="pr.author"></span></span>
                                    <span><i class="fas fa-check text-green-600"></i> <span x-text="pr.passed"></span></span>
                                    <span><i class="fas fa-times text-red-600"></i> <span x-text="pr.failed"></span></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Agent Status Panel -->
                <div class="bg-white rounded-lg shadow">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-900">
                            <i class="fas fa-cogs text-blue-600"></i>
                            Agent Status
                        </h3>
                    </div>
                    <div class="p-6">
                        <div class="space-y-4">
                            <template x-for="agent in agents" :key="agent.name">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div :class="{
                                            'bg-green-500': agent.status === 'active',
                                            'bg-yellow-500': agent.status === 'warning',
                                            'bg-red-500': agent.status === 'error'
                                        }" class="w-3 h-3 rounded-full"></div>
                                        <div>
                                            <span class="text-sm font-medium text-gray-900" x-text="agent.name"></span>
                                            <div class="text-xs text-gray-500">
                                                Weight: <span x-text="agent.weight"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-sm text-gray-900" x-text="agent.accuracy + '%'"></div>
                                        <div class="text-xs text-gray-500" x-text="agent.totalChecks + ' checks'"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="mt-8 bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">
                    <i class="fas fa-bolt text-yellow-600"></i>
                    Quick Actions
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button class="action-btn" @click="triggerManualReview()">
                        <i class="fas fa-play"></i>
                        Trigger Manual Review
                    </button>
                    <button class="action-btn" @click="viewConfiguration()">
                        <i class="fas fa-cog"></i>
                        Configure Agents
                    </button>
                    <button class="action-btn" @click="viewLogs()">
                        <i class="fas fa-file-alt"></i>
                        View Detailed Logs
                    </button>
                </div>
            </div>
        </main>
    </div>

    <style>
        .stats-card {
            @apply bg-white overflow-hidden shadow rounded-lg p-6;
        }
        
        .btn {
            @apply inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2;
        }
        
        .btn-secondary {
            @apply text-gray-700 bg-white border-gray-300 hover:bg-gray-50 focus:ring-indigo-500;
        }
        
        .action-btn {
            @apply flex items-center justify-center space-x-2 w-full px-4 py-3 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500;
        }
    </style>

    <script>
        function dashboard() {
            return {
                loading: false,
                stats: {
                    totalPRs: 1247,
                    todayPRs: 23,
                    autoMerged: 892,
                    issuesFound: 156,
                    criticalIssues: 12,
                    avgReviewTime: '47s'
                },
                recentPRs: [
                    {
                        id: 1,
                        title: 'Add user authentication middleware',
                        repo: 'backend/api',
                        author: 'alice',
                        status: 'merged',
                        score: '0.92',
                        passed: 11,
                        failed: 1,
                        timeAgo: '2 min ago'
                    },
                    {
                        id: 2,
                        title: 'Update dashboard components',
                        repo: 'frontend/web',
                        author: 'bob',
                        status: 'review',
                        score: '0.65',
                        passed: 8,
                        failed: 4,
                        timeAgo: '15 min ago'
                    },
                    {
                        id: 3,
                        title: 'Database migration scripts',
                        repo: 'infrastructure/db',
                        author: 'charlie',
                        status: 'blocked',
                        score: '0.23',
                        passed: 3,
                        failed: 9,
                        timeAgo: '1 hour ago'
                    },
                    {
                        id: 4,
                        title: 'Performance optimization',
                        repo: 'backend/core',
                        author: 'diana',
                        status: 'merged',
                        score: '0.88',
                        passed: 10,
                        failed: 2,
                        timeAgo: '2 hours ago'
                    }
                ],
                agents: [
                    { name: 'Security', status: 'active', weight: '2.0', accuracy: '96', totalChecks: '1247' },
                    { name: 'Performance', status: 'active', weight: '1.5', accuracy: '89', totalChecks: '1247' },
                    { name: 'Business Logic', status: 'active', weight: '2.0', accuracy: '91', totalChecks: '1247' },
                    { name: 'Testing', status: 'warning', weight: '1.5', accuracy: '85', totalChecks: '1102' },
                    { name: 'Architecture', status: 'active', weight: '1.5', accuracy: '92', totalChecks: '1247' },
                    { name: 'Compliance', status: 'active', weight: '2.0', accuracy: '98', totalChecks: '1247' },
                    { name: 'Dependencies', status: 'active', weight: '1.5', accuracy: '94', totalChecks: '1247' },
                    { name: 'Maintainability', status: 'active', weight: '1.5', accuracy: '87', totalChecks: '1247' },
                    { name: 'Documentation', status: 'active', weight: '1.0', accuracy: '81', totalChecks: '923' },
                    { name: 'Accessibility', status: 'active', weight: '1.0', accuracy: '88', totalChecks: '756' },
                    { name: 'Const', status: 'active', weight: '1.0', accuracy: '93', totalChecks: '543' },
                    { name: 'Style', status: 'active', weight: '0.5', accuracy: '95', totalChecks: '1247' }
                ],

                init() {
                    this.$nextTick(() => {
                        this.initCharts();
                    });
                },

                initCharts() {
                    // Agent Performance Chart
                    const agentCtx = document.getElementById('agentPerformanceChart').getContext('2d');
                    new Chart(agentCtx, {
                        type: 'bar',
                        data: {
                            labels: ['Security', 'Performance', 'Business Logic', 'Testing', 'Architecture', 'Compliance'],
                            datasets: [{
                                label: 'Accuracy %',
                                data: [96, 89, 91, 85, 92, 98],
                                backgroundColor: [
                                    'rgba(239, 68, 68, 0.7)',
                                    'rgba(245, 158, 11, 0.7)',
                                    'rgba(59, 130, 246, 0.7)',
                                    'rgba(34, 197, 94, 0.7)',
                                    'rgba(168, 85, 247, 0.7)',
                                    'rgba(236, 72, 153, 0.7)'
                                ],
                                borderColor: [
                                    'rgba(239, 68, 68, 1)',
                                    'rgba(245, 158, 11, 1)',
                                    'rgba(59, 130, 246, 1)',
                                    'rgba(34, 197, 94, 1)',
                                    'rgba(168, 85, 247, 1)',
                                    'rgba(236, 72, 153, 1)'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100
                                }
                            }
                        }
                    });

                    // Outcome Trends Chart
                    const trendCtx = document.getElementById('outcomeTrendsChart').getContext('2d');
                    new Chart(trendCtx, {
                        type: 'line',
                        data: {
                            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                            datasets: [{
                                label: 'Merged',
                                data: [42, 38, 45, 52, 49, 18, 12],
                                borderColor: 'rgba(34, 197, 94, 1)',
                                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                tension: 0.4
                            }, {
                                label: 'Review Required',
                                data: [15, 22, 18, 12, 16, 8, 5],
                                borderColor: 'rgba(245, 158, 11, 1)',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                tension: 0.4
                            }, {
                                label: 'Blocked',
                                data: [3, 5, 2, 4, 3, 1, 0],
                                borderColor: 'rgba(239, 68, 68, 1)',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                },

                refreshData() {
                    this.loading = true;
                    // Simulate API call
                    setTimeout(() => {
                        this.loading = false;
                        // Update stats with slight variations
                        this.stats.totalPRs += Math.floor(Math.random() * 3);
                        this.stats.todayPRs += Math.floor(Math.random() * 2);
                    }, 1000);
                },

                triggerManualReview() {
                    alert('Manual review trigger - integrate with your workflow API');
                },

                viewConfiguration() {
                    alert('Agent configuration panel - implement detailed settings');
                },

                viewLogs() {
                    alert('Detailed logs viewer - integrate with your logging system');
                }
            }
        }
    </script>
</body>
</html>

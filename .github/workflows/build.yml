name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: build-${{ github.ref }}-${{ matrix.service }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # plugin-host is a proper multi-stage Dockerfile (golang:1.25-trixie
          # builder + trixie-slim runtime). Should build cleanly in CI.
          - service: plugin-host
            context: .
            dockerfile: plugin-host/Dockerfile
            platforms: linux/arm64
          # dashboard + dispatch are "prebuilt binary" Dockerfiles that COPY
          # an *.arm64 artifact produced by the host's make targets. First
          # CI builds will fail until they're converted to multi-stage —
          # tracked for follow-up. Included now so the workflow surface is
          # complete and `bin/adam fleet pull` can resolve every image name.
          - service: dashboard
            context: dashboard
            dockerfile: dashboard/Dockerfile
            platforms: linux/arm64
          - service: dispatch-worker
            context: .
            dockerfile: dispatch/Dockerfile
            platforms: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/sirus20x6/adamaton-platform-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
